name: Build and release engine
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            command: desktop:linux
          - os: windows-latest
            command: desktop:windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test tests
      - run: bun run ${{ matrix.command }}
      - name: Export playable examples
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=$(bun -e 'import pkg from "./package.json"; console.log(pkg.version)')
          bun run game export-web examples/projects/beacon-run.scene.json build/beacon-run-web
          bun run game export-web examples/projects/script-lab.scene.json build/script-lab-web
          (cd build/beacon-run-web && zip -qr "../releases/Beacon-Run-${VERSION}-web.zip" .)
          (cd build/script-lab-web && zip -qr "../releases/Script-Lab-${VERSION}-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.os }}
          path: |
            build/releases/*.AppImage
            build/releases/*-win.zip
            build/releases/*-web.zip
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix=pinefall-engine/ HEAD > "releases/Pinefall-Engine-${VERSION}-source.zip"
          cd releases
          mv "Pinefall Engine-${VERSION}.AppImage" "Pinefall-Engine-${VERSION}-linux-x86_64.AppImage"
          mv "Pinefall Engine-${VERSION}-win.zip" "Pinefall-Engine-${VERSION}-win-x64.zip"
          sha256sum *.AppImage *.zip > "SHA256SUMS-${VERSION}.txt"
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: releases/*
