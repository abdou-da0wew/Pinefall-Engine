name: Build and release engine
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            command: desktop:linux
          - os: windows-latest
            command: desktop:windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test tests
      - run: bun run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.os }}
          path: |
            build/releases/*.AppImage
            build/releases/*-win.zip
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true
      - run: |
          git archive --format=zip --prefix=pinefall-engine/ HEAD > releases/Pinefall-Engine-source.zip
          cd releases
          sha256sum *.AppImage *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: releases/*
