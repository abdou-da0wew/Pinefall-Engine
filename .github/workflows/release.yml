name: Validate desktop asset pipeline
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: desktop:linux
          - os: windows-latest
            command: desktop:windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test tests
      - run: bun run ${{ matrix.command }}
      - name: Packaged Windows worker and PIF tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TEST_DESKTOP_EXECUTABLE = Join-Path $PWD "build/releases/win-unpacked/Pinefall Engine.exe"
          bun tests/assets-native.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun tests/pif-native.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/hardware-acceptance.ts --executable "$env:TEST_DESKTOP_EXECUTABLE" --software-test --output build/windows-software-evidence.json
          exit $LASTEXITCODE
      - name: Packaged Linux worker and PIF tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export TEST_DESKTOP_EXECUTABLE="$PWD/build/releases/linux-unpacked/pinefall-engine"
          xvfb-run -a bun tests/assets-native.ts
          xvfb-run -a bun tests/pif-native.ts
          xvfb-run -a bun scripts/hardware-acceptance.ts --executable "$TEST_DESKTOP_EXECUTABLE" --software-test --output build/linux-software-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-evidence-${{ matrix.os }}
          path: |
            build/*evidence.json
            build/assets-native.pif
            build/native-project.pif
          if-no-files-found: warn
# Publication is intentionally single-writer: scripts/publish-releases.ts verifies five
# exact assets before making a release public. CI must never overwrite its checksums.
